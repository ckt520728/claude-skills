<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoresearch RSI Knowledge Dashboard</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            color-scheme: dark;
            --accent: #0d9488; --accent-hover: #0f766e; --teal: #4dd9cf; --teal-soft: #7ee8e2; --bg: #09131f; --card: #112236;
            --line: #1e3a5f; --row: rgba(15, 43, 72, 0.5); --text: #f1f5f9; --muted: #a3b3c7; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --purple: #a78bfa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 30px; line-height: 1.55; }
        .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 30px; }
        h1 { font-size: 1.6rem; color: #fff; line-height: 1.3; overflow-wrap: anywhere; }
        .header p, .note, .intro { font-size: 0.86rem; color: var(--muted); }
        .intro { margin-bottom: 16px; }
        .badge { border: 1px solid var(--line); background: var(--row); color: var(--muted); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .badge.on { border-color: var(--ok); color: var(--ok); } .badge.off { border-color: var(--warn); color: var(--warn); }
        .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 25px; align-items: start; }
        .span2 { grid-column: 1 / -1; }
        .stack { display: grid; gap: 25px; min-width: 0; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; min-width: 0; }
        h2 { font-size: 1.1rem; color: #fff; margin-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; }
        h3 { font-size: 0.95rem; color: #fff; margin: 14px 0 8px; }
        .group { margin-bottom: 14px; }
        .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
        .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        label { display: block; font-size: 0.84rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        input, select, textarea { width: 100%; background: rgba(15, 43, 72, 0.6); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; color: #fff; font: inherit; font-size: 0.92rem; }
        textarea { min-height: 64px; resize: vertical; }
        :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
        .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        button { font: inherit; font-weight: 700; border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid transparent; color: inherit; }
        .primary { background: var(--accent); color: #fff; flex: 1 1 220px; } .primary:hover:not(:disabled) { background: var(--accent-hover); }
        .secondary { background: transparent; color: var(--text); border-color: var(--line); }
        .secondary:hover:not(:disabled) { border-color: var(--teal); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .message { font-size: 0.86rem; margin-top: 10px; } .message.error { color: var(--bad); } .message.warn { color: var(--warn); }
        .message a { color: var(--teal); }
        .log { background: #060c14; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-family: Consolas, monospace; font-size: 0.78rem; color: #8fd3f4; height: 220px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
        .pill { display: inline-block; font-size: 0.72rem; font-weight: 700; border: 1px solid currentColor; border-radius: 4px; padding: 1px 8px; white-space: nowrap; }
        .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .none { color: var(--muted); }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid currentColor; border-radius: 16px; padding: 2px 12px; font-size: 0.8rem; font-weight: 600; }
        .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .source { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.85rem; }
        .source:last-child { border-bottom: none; }
        .source strong { display: block; color: #fff; } .source span.detail { color: var(--muted); overflow-wrap: anywhere; }
        .run { background: var(--row); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
        .run.selected { border-color: var(--teal); }
        .run:last-child { margin-bottom: 0; }
        .run h3 { margin: 0 0 4px; overflow-wrap: anywhere; }
        .run p.meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; overflow-wrap: anywhere; }
        .actions { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
        .file { background: rgba(13, 148, 136, 0.28); border: 1px solid var(--teal); color: var(--teal-soft); padding: 5px 10px; border-radius: 6px; text-decoration: none; font-size: 0.79rem; font-weight: 600; }
        .file:hover { background: var(--accent-hover); color: #fff; }
        .small { padding: 4px 10px; font-size: 0.8rem; }
        code { font-family: Consolas, monospace; color: var(--teal-soft); overflow-wrap: anywhere; }
        .scroll-x { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: #0b1a2b; }
        svg.graph { display: block; }
        svg.graph text { fill: var(--text); font-size: 12px; font-family: inherit; }
        svg.graph .sub { fill: var(--muted); font-size: 10.5px; }
        svg.graph .tier { fill: #09131f; font-size: 10px; font-weight: 700; }
        svg.graph .edge { fill: none; stroke: #4b6a8f; stroke-width: 1.5; }
        svg.graph .node.running rect.box { animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 50% { stroke-opacity: 0.35; } }
        @media (prefers-reduced-motion: reduce) { svg.graph .node.running rect.box { animation: none; } }
        .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.78rem; margin-top: 8px; }
        .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: currentColor; margin-right: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.07); vertical-align: top; overflow-wrap: anywhere; }
        th { color: var(--muted); font-weight: 600; }
        .list { list-style: none; display: grid; gap: 6px; }
        .list li { background: var(--row); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 0.84rem; overflow-wrap: anywhere; }
        .list li button { all: unset; cursor: pointer; display: block; width: 100%; }
        .list li button:focus-visible { outline: 2px solid var(--teal); outline-offset: 4px; }
        .list .t { color: #fff; font-weight: 600; } .list .p { color: var(--muted); font-size: 0.76rem; }
        .findings { margin: 4px 0 0 18px; color: var(--muted); }
        .page { background: #0b1a2b; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; max-height: 460px; overflow: auto; font-size: 0.9rem; overflow-wrap: anywhere; }
        .page h1, .page h2, .page h3, .page h4 { color: #fff; margin: 12px 0 6px; border: 0; padding: 0; line-height: 1.3; }
        .page h1 { font-size: 1.25rem; } .page h2 { font-size: 1.1rem; } .page h3 { font-size: 1rem; } .page h4 { font-size: 0.92rem; }
        .page p, .page ul, .page ol, .page pre { margin: 6px 0; } .page ul, .page ol { padding-left: 22px; }
        .page pre { background: #060c14; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; font-size: 0.8rem; }
        .page a { color: var(--teal); } .page a.wiki { color: var(--purple); text-decoration: underline dotted; }
        .page hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
        dl.fm { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; font-size: 0.78rem; background: var(--row); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
        dl.fm dt { color: var(--muted); } dl.fm dd { color: var(--text); overflow-wrap: anywhere; }
        .mapwrap { position: relative; background: #0b1a2b; border: 1px solid var(--line); border-radius: 8px; }
        #kbMap { display: block; width: 100%; height: 380px; touch-action: none; cursor: grab; }
        .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .tile { background: var(--row); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
        .tile b { display: block; font-size: 1.25rem; color: #fff; } .tile span { font-size: 0.75rem; color: var(--muted); }
        .bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 6px; }
        .bar i { display: block; height: 100%; background: var(--ok); }
        @media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
        fieldset.robinbox { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
        fieldset.robinbox legend { font-size: 0.84rem; font-weight: 700; color: var(--teal); padding: 0 6px; }
        label.check { display: flex; align-items: center; gap: 8px; color: var(--text); margin-bottom: 10px; }
        label.check input { width: auto; }
        .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        .stat { background: var(--row); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 150px; }
        .stat b { display: block; font-size: 1.1rem; } .stat span { font-size: 0.76rem; color: var(--muted); }
        .bar { height: 6px; background: var(--line); border-radius: 3px; min-width: 60px; } .bar i { display: block; height: 100%; background: var(--teal); border-radius: 3px; }
        @media (max-width: 600px) { body { padding: 16px; } h1 { font-size: 1.3rem; } .card { padding: 16px; } .row3, .row2 { grid-template-columns: minmax(0, 1fr); } .source { grid-template-columns: minmax(0, 1fr); } }
    </style>
</head>
<body>
    <header class="header">
        <div><h1 id="title">Autoresearch RSI Knowledge Dashboard</h1><p id="owner"></p></div>
        <div class="badge" id="badge" role="status"></div>
    </header>
    <main class="grid">
        <section class="card span2" aria-labelledby="h-console">
            <h2 id="h-console" data-t="console"></h2>
            <p class="intro" data-t="intro"></p>
            <div class="group"><label data-t="providers"></label><div class="chips" id="providers"></div></div>
            <form id="form">
                <div class="group"><label for="topic" data-t="topic"></label><input type="text" id="topic" minlength="3" maxlength="300" required></div>
                <div class="row2 group">
                    <div><label for="loops" data-t="loops"></label><select id="loops"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
                    <div><label for="budget" data-t="budget"></label><input type="number" id="budget" min="0.1" max="30" step="any" value="5" required></div>
                </div>
                <div class="row3 group">
                    <div><label for="planner" data-t="planner"></label><select id="planner"></select></div>
                    <div><label for="executor" data-t="executor"></label><select id="executor"></select></div>
                    <div><label for="auditor" data-t="auditor"></label><select id="auditor"></select></div>
                </div>
                <fieldset class="group robinbox">
                    <legend data-t="robin_layer"></legend>
                    <label class="check"><input type="checkbox" id="robin" checked> <span data-t="robin_on"></span></label>
                    <div class="row3">
                        <div><label for="candidates" data-t="candidates"></label><input type="number" id="candidates" min="3" max="10" step="1" value="6"></div>
                        <div><label for="trajectories" data-t="trajectories"></label><select id="trajectories"><option value="1">1</option></select></div>
                        <div><label for="consensus" data-t="consensus"></label><select id="consensus"><option value="0.5">0.50</option><option value="0.75">0.75</option></select></div>
                    </div>
                    <p class="note" data-t="robin_hint"></p>
                </fieldset>
                <div class="group"><label for="feedback" data-t="feedback"></label><textarea id="feedback" maxlength="4000"></textarea></div>
                <div class="buttons">
                    <button type="submit" class="primary" id="run" disabled></button>
                    <button type="button" class="secondary" id="cancel" hidden data-t="cancel"></button>
                </div>
                <p class="message" id="message" role="status"></p>
            </form>
        </section>

        <section class="card span2" aria-labelledby="h-graph">
            <h2 id="h-graph" data-t="graph"></h2>
            <p class="note" id="progress" style="margin-bottom:10px" data-t="not_started"></p>
            <div class="scroll-x" id="graphBox"></div>
            <div class="legend" id="legend"></div>
        </section>

        <section class="card span2" aria-labelledby="h-robin">
            <h2 id="h-robin" data-t="robin_panel"></h2>
            <p class="intro" data-t="robin_intro"></p>
            <div id="robinBox"></div>
        </section>

        <div class="stack">
            <section class="card" aria-labelledby="h-log">
                <h2 id="h-log" data-t="log"></h2>
                <div class="log" id="logBox" tabindex="0"></div>
            </section>
            <section class="card" aria-labelledby="h-sources"><h2 id="h-sources" data-t="sources"></h2><p class="intro" id="sourcesIntro" data-t="sources_intro"></p><div id="sources"></div>
                <h3 data-t="audits"></h3><div id="audits"></div>
            </section>
        </div>
        <div class="stack">
            <section class="card" aria-labelledby="h-deliv"><h2 id="h-deliv" data-t="deliverables"></h2><div id="deliverables"></div></section>
            <section class="card" aria-labelledby="h-runs"><h2 id="h-runs" data-t="runs"></h2><div id="runs"></div></section>
        </div>

        <section class="card span2" aria-labelledby="h-kb">
            <h2 id="h-kb" data-t="kb"></h2>
            <div class="grid" style="gap:20px">
                <div style="min-width:0">
                    <div class="group"><label for="kbQuery" data-t="kb_search"></label><input type="search" id="kbQuery" autocomplete="off"></div>
                    <ul class="list" id="kbResults"></ul>
                    <h3 data-t="page"></h3>
                    <div id="kbPageBox"><div class="page" id="kbPage"></div></div>
                </div>
                <div style="min-width:0">
                    <label data-t="map"></label>
                    <div class="mapwrap"><canvas id="kbMap" role="img" aria-label="Concept map"></canvas></div>
                    <div class="legend" id="mapLegend"></div>
                    <p class="note" id="mapNote"></p>
                    <h3 data-t="gaps"></h3>
                    <ul class="list" id="gaps"></ul>
                </div>
            </div>
        </section>

        <section class="card span2" aria-labelledby="h-rsi">
            <h2 id="h-rsi" data-t="rsi"></h2>
            <div class="grid" style="gap:20px">
                <div style="min-width:0">
                    <h3 style="margin-top:0" data-t="fitness"></h3>
                    <div id="fitness"></div>
                    <div class="buttons" style="margin-top:12px"><button type="button" class="secondary" id="improve" data-t="improve"></button></div>
                    <p class="message" id="improveMsg" role="status"></p>
                    <h3 data-t="run_kb"></h3>
                    <div id="runKb"></div>
                </div>
                <div style="min-width:0">
                    <h3 style="margin-top:0"><span data-t="ledger"></span> <span id="chain"></span></h3>
                    <div class="scroll-x"><table id="ledgerTable"><thead><tr id="ledgerHead"></tr></thead><tbody id="ledger"></tbody></table></div>
                </div>
            </div>
        </section>
    </main>

        const t = (key) => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;

        function applyLanguage() {

        function el(tag, className, text) {
            const node = document.createElement(tag);

            if (text !== undefined && text !== null) node.textContent = String(text);

        const svgEl = (tag, attrs, text) => {
            const node = document.createElementNS('http://www.w3.org/2000/svg', tag);

            if (text !== undefined) node.textContent = String(text);
            return node;

        async function api(path, options) {
            const response = await fetch(path, options);

            return data;

        const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

        // ------------------------------------------------------------------ config

        function applyConfig(config) {
            if (I18N[config.language]) lang = config.language;

            if (config.default_loops) $('loops').value = String(config.default_loops);
            const tiers = config.tiers || {};

            fillSelect('planner', high, config.default_planner);
            fillSelect('executor', medium, config.default_executor);
            fillSelect('auditor', high, config.default_auditor);
            const rb = config.robin;
            if (rb) {
                $('robin').checked = !!rb.robin;
                fillSelect('trajectories', (rb.trajectory_choices || [1]).map(String), String(rb.trajectories));

        // A setting that would change nothing is disabled, never silently ignored.
        function syncRobin() {
            const on = $('robin').checked;

        function showRobin(report) {
            const rb = report.robin;
            if (!rb) { $('robinBox').replaceChildren(empty('robin_none')); return; }
            if (!rb.enabled) { $('robinBox').replaceChildren(empty('robin_off')); return; }
            const parts = [];
            const stats = el('div', 'stats');
            const stat = (label, value, tone) => { const s = el('div', 'stat'); const b = el('b', tone || '', value); s.append(b, el('span', '', t(label))); return s; };
            const rate = rb.final_rate;
            const tour = rb.tournament || {};
            stats.append(
                stat('r_status', rb.status ? t(rb.status) : t('RUNNING'), TONE[rb.status] || ''),
                stat('r_rate', typeof rate === 'number' ? `${(rate * 100).toFixed(1)}%` : '—', typeof rate === 'number' ? (rate <= 0.02 ? 'ok' : 'bad') : 'none'),
                stat('r_library', `${(rb.library || {}).on_topic_verified ?? 0} / ${(rb.library || {}).entries ?? 0}`),
                stat('r_findings', String((rb.findings || []).length)),
                stat('r_matches', tour.matches ? `${tour.completed}/${tour.matches}` : '—', tour.matches ? (tour.ran ? 'ok' : 'bad') : 'none'));
            if (typeof tour.position_a_share === 'number') stats.append(stat('r_bias', `${Math.round(tour.position_a_share * 100)}%`, Math.abs(tour.position_a_share - 0.5) > 0.25 ? 'warn' : ''));
            if (rb.consensus) stats.append(stat('r_consensus', `${rb.consensus.included} / ${rb.consensus.excluded} (≥ ${rb.consensus.threshold})`));
            parts.push(stats);
            const ranked = rb.ranked || [];
            if (ranked.length) {
                parts.push(el('h3', '', t('r_ranked')));
                const table = el('table'); const head = el('thead'); const hr = el('tr');
                ['r_rank', 'r_hyp', 'r_btl', 'r_win', 'r_games', 'r_keys'].forEach((k) => hr.append(el('th', '', t(k))));
                head.append(hr);
                const body = el('tbody');
                ranked.forEach((h) => {
                    const row = el('tr');
                    const hyp = el('td'); hyp.append(el('div', '', h.statement));
                    if (h.test) hyp.append(el('div', 'none', `${t('r_test')}: ${h.test}`));
                    const win = el('td');
                    if (typeof h.win_rate === 'number') { const bar = el('div', 'bar'); const fill = el('i'); fill.style.width = `${Math.round(h.win_rate * 100)}%`; bar.append(fill); win.append(el('div', '', num(h.win_rate)), bar); } else win.textContent = '—';
                    row.append(el('td', '', h.rank), hyp, el('td', '', num(h.btl_score)), win, el('td', '', h.games ?? 0), el('td', '', (h.evidence_ids || []).join(', ')));
                    body.append(row);

            const qc = rb.qc || [];
            if (qc.length) {
                parts.push(el('h3', '', t('r_qc')));

            }
            const files = ['citation_library.json', 'evidence_report.json', 'hallucination_rate_log.jsonl', 'seed_ideas.json', 'ranked_candidates.json', 'tournament.json', 'consensus_findings.json', 'claim_ledger.csv', 'robin_qc.md']
                .filter((f) => f !== 'consensus_findings.json' || rb.consensus)

        // ------------------------------------------------------------------ graph (inline SVG DAG)
        const NW = 168, NH = 58, GX = 56, GY = 22, PAD = 16;
        function drawGraph(graph) {
            const nodes = (graph && graph.nodes) || [];
            const edges = (graph && graph.edges) || [];
            if (!nodes.length) { $('graphBox').replaceChildren(empty('no_graph')); return; }
            const index = new Map(nodes.map((n, i) => [n.id, i]));
            const preds = nodes.map(() => []);
            edges.forEach((e) => { const s = index.get(e.source), d = index.get(e.target); if (s !== undefined && d !== undefined && s !== d) preds[d].push(s); });
            const layer = nodes.map(() => 0);
            for (let pass = 0; pass < nodes.length; pass++) {
                let changed = false;
                nodes.forEach((n, i) => preds[i].forEach((p) => { if (layer[p] + 1 > layer[i] && layer[p] + 1 < nodes.length) { layer[i] = layer[p] + 1; changed = true; } }));
                if (!changed) break;
            }
            const columns = [];
            nodes.forEach((n, i) => { (columns[layer[i]] = columns[layer[i]] || []).push(i); });
            const tallest = Math.max(...columns.filter(Boolean).map((c) => c.length));
            const height = PAD * 2 + tallest * NH + (tallest - 1) * GY;
            const width = PAD * 2 + columns.length * NW + (columns.length - 1) * GX;
            const pos = [];
            columns.forEach((col, c) => {
                if (!col) return;
                const colH = col.length * NH + (col.length - 1) * GY;
                col.forEach((i, r) => { pos[i] = { x: PAD + c * (NW + GX), y: PAD + (height - PAD * 2 - colH) / 2 + r * (NH + GY) }; });
            });
            const svg = svgEl('svg', { class: 'graph', width, height, viewBox: `0 0 ${width} ${height}`, role: 'img', 'aria-label': t('graph') });
            const defs = svgEl('defs');
            const marker = svgEl('marker', { id: 'arrow', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' });
            marker.append(svgEl('path', { d: 'M0,0 L10,5 L0,10 z', fill: '#4b6a8f' }));
            defs.append(marker);
            svg.append(defs);
            edges.forEach((e) => {
                const s = index.get(e.source), d = index.get(e.target);
                if (s === undefined || d === undefined) return;
                const x1 = pos[s].x + NW, y1 = pos[s].y + NH / 2, x2 = pos[d].x, y2 = pos[d].y + NH / 2;
                const mid = Math.max(20, (x2 - x1) / 2);
                svg.append(svgEl('path', { class: 'edge', d: `M${x1},${y1} C${x1 + mid},${y1} ${x2 - mid},${y2} ${x2},${y2}`, 'marker-end': 'url(#arrow)' }));
            });
            nodes.forEach((n, i) => {
                const status = NODE_COLOR[n.status] ? n.status : 'pending';
                const color = NODE_COLOR[status];
                const g = svgEl('g', { class: `node ${status}`, 'data-node-id': n.id, transform: `translate(${pos[i].x},${pos[i].y})` });
                g.append(svgEl('title', {}, `${n.label || n.id} · ${t(status === 'running' ? 'running_s' : status)}${n.detail ? '\n' + n.detail : ''}`));
                g.append(svgEl('rect', { class: 'box', width: NW, height: NH, rx: 8, fill: '#0f2b48', stroke: color, 'stroke-width': 2, 'stroke-dasharray': status === 'skipped' ? '5 4' : '0' }));
                const label = String(n.label || n.id);
                g.append(svgEl('text', { x: 10, y: 22 }, label.length > 22 ? label.slice(0, 21) + '…' : label));
                g.append(svgEl('text', { class: 'sub', x: 10, y: 43 }, `${t(status === 'running' ? 'running_s' : status)} · ${Number(n.attempts) || 0} ${t('attempts')}`));
                if (n.tier) {
                    const w = String(n.tier).length * 6.2 + 12;
                    g.append(svgEl('rect', { x: NW - w - 6, y: 6, width: w, height: 15, rx: 7, fill: color }));
                    g.append(svgEl('text', { class: 'tier', x: NW - w / 2 - 6, y: 17, 'text-anchor': 'middle' }, n.tier));
                }
                svg.append(g);
            });
            $('graphBox').replaceChildren(svg);
        }

        function showSources(report) {

        function showDeliverables(report) {

        // ------------------------------------------------------------------ knowledge base: pages + viewer
        const wikiTarget = (raw) => raw.trim().replace(/\.md$/i, '') + '.md';

        function inline(parent, text) {
            const re = /\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]|\[([^\]]+)\]\(([^)\s]+)\)|`([^`]+)`|\*\*([^*]+)\*\*/g;
            let last = 0, m;
            while ((m = re.exec(text)) !== null) {
                if (m.index > last) parent.append(document.createTextNode(text.slice(last, m.index)));
                if (m[1] !== undefined) {
                    const a = el('a', 'wiki', (m[2] || m[1]).trim());
                    a.href = '#'; a.dataset.path = wikiTarget(m[1]);
                    a.addEventListener('click', (e) => { e.preventDefault(); openPage(a.dataset.path); });
                    parent.append(a);
                } else if (m[3] !== undefined) {
                    if (/^https?:\/\//i.test(m[4])) { const a = el('a', '', m[3]); a.href = m[4]; a.target = '_blank'; a.rel = 'noopener noreferrer'; parent.append(a); }
                    else parent.append(document.createTextNode(m[0]));
                } else if (m[5] !== undefined) parent.append(el('code', '', m[5]));
                else parent.append(el('strong', '', m[6]));
                last = re.lastIndex;
            }
            if (last < text.length) parent.append(document.createTextNode(text.slice(last)));
        }

        function renderMarkdown(body) {
            const root = document.createDocumentFragment();
            const lines = String(body || '').replace(/\r\n?/g, '\n').split('\n');
            let list = null, para = null, fence = null;
            const flush = () => { para = null; list = null; };
            for (const line of lines) {
                if (fence) {
                    if (/^```/.test(line)) { root.append(fence); fence = null; } else fence.firstChild.textContent += (fence.firstChild.textContent ? '\n' : '') + line;
                    continue;
                }
                if (/^```/.test(line)) { flush(); fence = el('pre'); fence.append(el('code', '', '')); continue; }
                if (/^\s*<!--.*-->\s*$/.test(line)) continue;
                if (!line.trim()) { flush(); continue; }
                let m;
                if ((m = /^(#{1,4})\s+(.*)$/.exec(line))) { flush(); const h = el('h' + m[1].length); inline(h, m[2]); root.append(h); continue; }
                if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flush(); root.append(el('hr')); continue; }
                if ((m = /^\s*([-*+]|\d+\.)\s+(.*)$/.exec(line))) {
                    const tag = /\d/.test(m[1]) ? 'ol' : 'ul';
                    if (!list || list.tagName.toLowerCase() !== tag) { list = el(tag); root.append(list); }
                    para = null;
                    const li = el('li'); inline(li, m[2].replace(/^\[[ xX]\]\s+/, (c) => (/x/i.test(c) ? '☑ ' : '☐ '))); list.append(li);
                    continue;
                }
                list = null;
                if (!para) { para = el('p'); root.append(para); } else para.append(document.createTextNode(' '));
                inline(para, line.replace(/^>\s?/, ''));
            }
            if (fence) root.append(fence);
            return root;
        }

        // ------------------------------------------------------------------ knowledge base: concept map (canvas force layout)
        const MAP = { nodes: [], edges: [], alpha: 0, raf: 0, drag: null, hover: null, w: 0, h: 0, dpr: 1, moved: 0 };
        const canvas = $('kbMap');
        const ctx = canvas.getContext('2d');

        function sizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            MAP.dpr = window.devicePixelRatio || 1;
            MAP.w = Math.max(1, rect.width); MAP.h = Math.max(1, rect.height);
            canvas.width = Math.max(1, Math.round(MAP.w * MAP.dpr)); canvas.height = Math.max(1, Math.round(MAP.h * MAP.dpr));
        }

        function initMap(graph) {
            const nodes = ((graph && graph.nodes) || []).slice(0, 400);
            const byId = new Map();
            MAP.nodes = nodes.map((n, i) => {
                const a = (i / Math.max(1, nodes.length)) * Math.PI * 2, r = Math.min(MAP.w, MAP.h) * 0.3;
                const node = { id: n.id, label: n.label || n.id, type: TYPE_COLOR[n.type] ? n.type : 'other', degree: n.degree || 0, x: MAP.w / 2 + Math.cos(a) * r, y: MAP.h / 2 + Math.sin(a) * r, vx: 0, vy: 0 };
                node.r = 4 + Math.min(9, Math.sqrt(node.degree) * 2.2);
                byId.set(n.id, node); return node;
            });
            MAP.edges = ((graph && graph.edges) || []).map((e) => [byId.get(e.source), byId.get(e.target)]).filter((p) => p[0] && p[1] && p[0] !== p[1]);
            $('mapNote').textContent = MAP.nodes.length ? t('map_hint') : t('no_map');
            MAP.hover = null; MAP.drag = null;
            cancelAnimationFrame(MAP.raf); MAP.raf = 0;
            if (reduceMotion) { for (let i = 0; i < 300; i++) step(0.5); draw(); }
            else { MAP.alpha = 1; loop(); }
        }

        function step(alpha) {
            const ns = MAP.nodes;
            for (let i = 0; i < ns.length; i++) {
                for (let j = i + 1; j < ns.length; j++) {
                    let dx = ns[j].x - ns[i].x, dy = ns[j].y - ns[i].y, d2 = dx * dx + dy * dy;
                    if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
                    if (d2 > 90000) continue;
                    const f = (1800 / d2) * alpha, d = Math.sqrt(d2);
                    ns[i].vx -= (dx / d) * f; ns[i].vy -= (dy / d) * f; ns[j].vx += (dx / d) * f; ns[j].vy += (dy / d) * f;
                }
            }
            MAP.edges.forEach(([a, b]) => {
                const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1, f = (d - 70) * 0.02 * alpha;
                a.vx += (dx / d) * f; a.vy += (dy / d) * f; b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
            });
            ns.forEach((n) => {
                n.vx += (MAP.w / 2 - n.x) * 0.012 * alpha; n.vy += (MAP.h / 2 - n.y) * 0.012 * alpha;
                if (n !== MAP.drag) { n.x += n.vx; n.y += n.vy; }
                n.vx *= 0.8; n.vy *= 0.8;
                n.x = Math.min(MAP.w - n.r, Math.max(n.r, n.x)); n.y = Math.min(MAP.h - n.r, Math.max(n.r, n.y));
            });
        }

        function loop() {
            step(MAP.alpha); draw();
            MAP.alpha *= 0.985;
            MAP.raf = (MAP.alpha > 0.02 || MAP.drag) ? requestAnimationFrame(loop) : 0;
        }
        function kick() { if (reduceMotion) { draw(); return; } MAP.alpha = Math.max(MAP.alpha, 0.35); if (!MAP.raf) loop(); }

        function draw() {
            ctx.setTransform(MAP.dpr, 0, 0, MAP.dpr, 0, 0);
            ctx.clearRect(0, 0, MAP.w, MAP.h);
            ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(120,150,190,0.35)';
            MAP.edges.forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); });
            MAP.nodes.forEach((n) => {
                ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                ctx.fillStyle = TYPE_COLOR[n.type]; ctx.fill();
                if (n === MAP.hover) { ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke(); }
            });
            if (MAP.hover) {
                const n = MAP.hover; ctx.font = '12px sans-serif';
                const tw = ctx.measureText(n.label).width + 12;
                const x = Math.min(MAP.w - tw - 2, Math.max(2, n.x - tw / 2)), y = n.y - n.r - 24 < 2 ? n.y + n.r + 6 : n.y - n.r - 24;
                ctx.fillStyle = 'rgba(6,12,20,0.92)'; ctx.fillRect(x, y, tw, 20);
                ctx.strokeStyle = TYPE_COLOR[n.type]; ctx.lineWidth = 1; ctx.strokeRect(x, y, tw, 20);
                ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(n.label, x + 6, y + 10);
            }
        }

        function nodeAt(x, y) {
            for (let i = MAP.nodes.length - 1; i >= 0; i--) { const n = MAP.nodes[i]; if (Math.hypot(n.x - x, n.y - y) <= n.r + 4) return n; }
            return null;
        }
        const localXY = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
        canvas.addEventListener('pointerdown', (e) => {
            const [x, y] = localXY(e); const n = nodeAt(x, y);
            if (n) { MAP.drag = n; MAP.moved = 0; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; kick(); }
        });
        canvas.addEventListener('pointermove', (e) => {
            const [x, y] = localXY(e);
            if (MAP.drag) { MAP.moved += 1; MAP.drag.x = x; MAP.drag.y = y; MAP.drag.vx = MAP.drag.vy = 0; kick(); if (reduceMotion) draw(); return; }
            const n = nodeAt(x, y);
            if (n !== MAP.hover) { MAP.hover = n; canvas.style.cursor = n ? 'pointer' : 'grab'; if (!MAP.raf) draw(); }
        });
        const endDrag = (e) => {
            const n = MAP.drag; MAP.drag = null; canvas.style.cursor = 'grab';
            if (n && e.type === 'pointerup' && MAP.moved < 3) openPage(n.id + '.md');
        };
        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', endDrag);
        canvas.addEventListener('pointerleave', () => { if (!MAP.drag && MAP.hover) { MAP.hover = null; if (!MAP.raf) draw(); } });
        let resizeTimer = null;
        window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { sizeCanvas(); MAP.nodes.forEach((n) => { n.x = Math.min(n.x, MAP.w); n.y = Math.min(n.y, MAP.h); }); draw(); }, 100); });

        function showFitness(f) {

            tiles.append(score);
            order.filter((k) => typeof f[k] === 'number').forEach((k) => { const tile = el('div', 'tile'); tile.dataset.metric = k; tile.append(el('b', '', f[k]), el('span', '', t('m_' + k))); tiles.append(tile); });
            $('fitness').replaceChildren(tiles);

                    $('message').replaceChildren(t('local_file'), link, t('local_file2'));
                } catch (err) {
                    $('badge').textContent = t('no_server'); $('badge').classList.add('off');
                    say(t('start_server'), 'warn');
                }
                return;
            }
            try {
                applyConfig(await api('api/config'));
                const data = await refreshRuns();
                $('badge').textContent = t('connected'); $('badge').classList.add('on');
                setRunning(false);
                loadKb();
                if (data.active) await watch(data.active);
                else if ((data.runs || []).length) await selectRun(data.runs[0].run_id);
            } catch (err) {
                $('badge').textContent = t('no_server'); $('badge').classList.add('off');
                say(t('lost'), 'error');
            }
        }

        start();
    </script>
</body>
</html>

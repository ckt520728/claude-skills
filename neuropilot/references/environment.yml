# VCL NeuroPilot — conda environment for the real task3_v2 pipeline.
# Create:   conda env create -f environment.yml
# Activate: conda activate neuropilot
# (First run of stage 01 downloads MNE sample montage data — allow a minute.)
name: neuropilot
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - openpyxl>=3.1
  - matplotlib>=3.7
  - seaborn>=0.13
  - plotly>=5.18
  - mne>=1.6
  - streamlit>=1.32
  - python-docx>=1.1
  - python-pptx>=0.6
  - jinja2>=3.1
  - pytest>=8.0
  - pip
  - pip:
      - python-dotenv>=1.0
      - mne-connectivity>=0.5
      - "mcp[cli]>=1.0"
      - fastmcp>=0.2
      - shap>=0.44
      # --- v2 enhanced preprocessing (optional; stage 01 falls back to v1 if missing) ---
      - emd>=0.6
      - meegkit>=0.1.7
      - pyprep>=0.4
      - mne-icalabel>=0.6
      - python-picard>=0.7

[project]
name = "kgengine"
version = "0.1.0"
description = "Knowledge-graph engine over a research library; integrates with Claude (MCP/API/CLI) and other models"
requires-python = ">=3.11"
dependencies = [
  "anthropic", "pydantic>=2", "networkx>=3.2", "rapidfuzz", "pymupdf", "python-docx",
  "httpx", "fastapi", "uvicorn", "mcp[cli]>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kg = "kgengine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kgengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
